<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1E4B">
<title>过级 · 四六级备考练习</title>
<meta name="description" content="四六级阅读刷题 / 听力 / 作文批改 / 翻译练习，纯前端 PWA，可打包成 APK。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='5' y='3' width='14' height='18' rx='2.5' fill='%230B1E4B'/><path d='M8.5 8h7M8.5 12h7M8.5 16h4.5' stroke='%23FFD983' stroke-width='1.6' stroke-linecap='round'/></svg>">
</head>
<body>
<div id="app">
  <div id="loading"><span class="dot"></span><span id="loadingText">正在读取题库…</span></div>

  <section class="screen" id="scr-practice"></section>
  <section class="screen" id="scr-exam"></section>
  <section class="screen" id="scr-result"></section>
  <section class="screen" id="scr-essay"></section>
  <section class="screen" id="scr-trans"></section>
  <section class="screen" id="scr-drill"></section>
  <section class="screen" id="scr-listen"></section>
  <section class="screen" id="scr-listen-exam"></section>
  <section class="screen" id="scr-words"></section>
  <section class="screen" id="scr-me"></section>

  <nav id="tabbar">
    <button class="tab on" data-tab="practice" onclick="UI.tabGo('practice')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5.5h9.5a2 2 0 0 1 2 2V20a1.6 1.6 0 0 0-1.6-1.6H4z" stroke-linejoin="round"/><path d="M20 5.5h-1.5a2 2 0 0 0-2 2V20a1.6 1.6 0 0 1 1.6-1.6H20z" stroke-linejoin="round"/></svg>练习
    </button>
    <button class="tab" data-tab="grade" onclick="UI.tabGo('grade')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M15.5 4.5l4 4L8 20H4v-4z" stroke-linejoin="round"/><path d="M13.5 6.5l4 4" stroke-linecap="round"/></svg>批改
    </button>
    <button class="tab" data-tab="words" onclick="UI.tabGo('words')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4.5h11a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z" stroke-linejoin="round"/><path d="M8 4.5V20" stroke-linecap="round"/></svg>生词
    </button>
    <button class="tab" data-tab="me" onclick="UI.tabGo('me')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.8-3.4 3.6-5.4 7-5.4s6.2 2 7 5.4" stroke-linecap="round"/></svg>我的
    </button>
  </nav>

  <div id="toast"></div>
  <div id="overlay"></div>
  <div id="print-root"></div>
</div>

<script src="flavor.js"></script>
<script src="js/app.js"></script>
<script src="js/ai.js"></script>
<!-- 题库不走 <script> 预载：网页版只读 index.json + 按需 fetch 单套；
     file:// 双击时由 bank.js 动态注入 bank.js / listening.js 打包产物（否则首屏要解析 17MB） -->
<script src="data/exam/audio.js"></script>
<script src="data/exam/dict.js"></script>
<script src="js/bank.js"></script>
<script src="js/ui.js"></script>
<script src="js/exam.js"></script>
<script src="data/exam/templates.js"></script>
<!-- 本地评分引擎：rubric_w.js 是生成的词表，必须在 rubric.js 之前；两者都必须在 offline.js 之前 -->
<script src="js/rubric_w.js"></script>
<script src="js/rubric.js"></script>
<script src="js/offline.js"></script>
<script src="js/essay.js"></script>
<script src="js/trans.js"></script>
<script src="js/words.js"></script>
<script src="js/listen.js"></script>
<script src="js/me.js"></script>
<script>
/* PWA：注册 Service Worker；新版本激活后自动刷新一次 */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === '127.0.0.1' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
    var reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!reloaded) { reloaded = true; location.reload(); }
    });
  });
}
UI.init();
</script>
</body>
</html>
